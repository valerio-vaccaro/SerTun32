[pytest]
testpaths = tests
addopts = -ra --capture=tee-sys
markers =
    performance: timed end-to-end throughput and burst tests
    pingpong: long-running strict one-byte round-trip test
    large_transfer: three 1 MiB messages transferred in both directions
    large_payload: 1 MiB payload cases that are disabled by default
    qemu: firmware-in-the-loop tests using Espressif QEMU
