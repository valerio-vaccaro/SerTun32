; SerTun32 build targets:
;   lilygo-t-display-s3  Full ESP32-S3 hardware, native USB, 1 MiB RX queue
;   lilygo-t-display     Original ESP32 hardware, UART USB bridge, 64 KiB queue
;   qemu-esp32           Headless UART0 <-> UART2 bridge for Espressif QEMU

[platformio]
default_envs = lilygo-t-display-s3

[env]
extra_scripts = pre:scripts/reproducible_build.py

[physical]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@8.4.0
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

[env:lilygo-t-display-s3]
extends = physical
board = lilygo-t-display-s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
upload_speed = 115200
upload_flags = --no-stub
build_flags =
    ${physical.build_flags}
    -D SERTUN_BOARD_TDISPLAY_S3=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D INIT_SEQUENCE_3=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH

[env:lilygo-t-display]
extends = physical
board = lilygo-t-display
upload_speed = 460800
build_flags =
    ${physical.build_flags}
    -D SERTUN_BOARD_TDISPLAY=1
    -D TFT_SDA_READ=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

[env:qemu-esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_flags =
    -D SERTUN_QEMU=1
    -D CORE_DEBUG_LEVEL=0
